<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JARVIS // 3D Car Part Inspector</title>
<style>
  /* ============================================================
     JARVIS HUD — Sci-Fi Glassmorphism Theme
     ============================================================ */
  :root {
    --cyan: #00e5ff;
    --cyan-dim: rgba(0, 229, 255, 0.35);
    --cyan-glow: rgba(0, 229, 255, 0.12);
    --bg-dark: #04070d;
    --panel-bg: rgba(6, 16, 26, 0.72);
    --text: #d8f6ff;
    --text-dim: #6fa8b8;
    --danger: #ff3b57;
    --ok: #2bff9e;
    --warn: #ffc400;
    --mono: 'Consolas', 'SF Mono', 'Menlo', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg-dark);
    font-family: var(--mono);
    color: var(--text);
  }

  #scene-canvas { position: fixed; inset: 0; display: block; }

  /* ---------- Scanline / vignette overlay ---------- */
  #fx-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background:
      repeating-linear-gradient(0deg, rgba(0,229,255,0.02) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  /* ---------- Top HUD bar ---------- */
  #top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px;
    pointer-events: none;
    text-transform: uppercase; letter-spacing: 3px; font-size: 11px;
  }
  #top-bar .brand { color: var(--cyan); text-shadow: 0 0 12px var(--cyan-dim); }
  #top-bar .brand::before { content: '◈ '; }
  #top-bar .clock { color: var(--text-dim); }
  #top-bar .clock b { color: var(--text); font-weight: normal; }

  /* ---------- Corner brackets ---------- */
  .corner {
    position: fixed; width: 42px; height: 42px; z-index: 9;
    border: 2px solid var(--cyan-dim); pointer-events: none;
    animation: cornerPulse 3s ease-in-out infinite;
  }
  .corner.tl { top: 52px; left: 16px;  border-right: 0; border-bottom: 0; }
  .corner.tr { top: 52px; right: 16px; border-left: 0;  border-bottom: 0; }
  .corner.bl { bottom: 16px; left: 16px;  border-right: 0; border-top: 0; }
  .corner.br { bottom: 16px; right: 16px; border-left: 0; border-top: 0; }
  @keyframes cornerPulse {
    0%, 100% { opacity: 0.35; } 50% { opacity: 1; }
  }

  /* ---------- Bottom-left control cluster ---------- */
  #controls {
    position: fixed; left: 24px; bottom: 28px; z-index: 10;
    display: flex; flex-direction: column; gap: 10px;
  }
  .hud-btn {
    pointer-events: auto;
    background: var(--panel-bg);
    border: 1px solid var(--cyan-dim);
    color: var(--cyan);
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 2px; text-transform: uppercase;
    padding: 10px 18px; min-width: 180px; text-align: left;
    cursor: pointer; position: relative;
    backdrop-filter: blur(8px);
    transition: all 0.25s ease;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .hud-btn:hover {
    background: var(--cyan-glow);
    box-shadow: 0 0 18px var(--cyan-dim), inset 0 0 18px var(--cyan-glow);
    color: #fff;
  }
  .hud-btn.active {
    background: var(--cyan); color: #001318; font-weight: bold;
    box-shadow: 0 0 24px var(--cyan-dim);
  }
  .hud-btn::before { content: '▸ '; }

  /* ---------- Spec side panel (flies in) ---------- */
  #spec-panel {
    position: fixed; top: 70px; right: -420px; bottom: 90px; width: 360px;
    z-index: 20;
    background: var(--panel-bg);
    border: 1px solid var(--cyan-dim);
    border-right: 0;
    backdrop-filter: blur(14px);
    padding: 26px 24px;
    display: flex; flex-direction: column; gap: 16px;
    transition: right 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
    opacity: 0;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 28px), calc(100% - 28px) 100%, 0 100%);
    box-shadow: -10px 0 40px rgba(0, 229, 255, 0.08);
    overflow-y: auto;
  }
  #spec-panel.open { right: 24px; opacity: 1; }

  #spec-panel .panel-tag {
    font-size: 9px; letter-spacing: 4px; color: var(--text-dim);
    text-transform: uppercase;
  }
  #spec-close {
    position: absolute; top: 14px; right: 14px;
    width: 28px; height: 28px;
    background: transparent; border: 1px solid var(--cyan-dim);
    color: var(--cyan); cursor: pointer; font-family: var(--mono);
    font-size: 13px; line-height: 1;
    transition: all 0.2s;
  }
  #spec-close:hover {
    background: var(--danger); border-color: var(--danger); color: #fff;
    box-shadow: 0 0 14px rgba(255,59,87,0.6);
    transform: rotate(90deg);
  }
  #spec-name {
    font-size: 22px; color: #fff; text-transform: uppercase;
    letter-spacing: 2px; text-shadow: 0 0 16px var(--cyan-dim);
    padding-right: 30px;
  }
  #spec-id { font-size: 10px; color: var(--cyan); letter-spacing: 3px; }

  .spec-divider {
    height: 1px; flex-shrink: 0;
    background: linear-gradient(90deg, var(--cyan), transparent);
    opacity: 0.5;
  }

  /* Spec rows */
  .spec-row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    font-size: 12px; padding: 4px 0;
    border-bottom: 1px dashed rgba(0,229,255,0.12);
  }
  .spec-row .k { color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; font-size: 10px; }
  .spec-row .v { color: var(--text); text-align: right; }
  .spec-row .v.hl { color: var(--cyan); text-shadow: 0 0 8px var(--cyan-dim); }

  /* Status pill */
  .status-pill {
    align-self: flex-start;
    padding: 5px 14px; font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase; border: 1px solid;
    animation: pillGlow 2s ease-in-out infinite;
  }
  @keyframes pillGlow {
    0%, 100% { box-shadow: 0 0 6px currentColor; } 50% { box-shadow: 0 0 18px currentColor; }
  }

  /* Animated bars (wear / temperature) */
  .bar-wrap { margin-top: 2px; }
  .bar-track {
    height: 6px; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(0,229,255,0.15); position: relative; overflow: hidden;
  }
  .bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--cyan), #7df9ff);
    box-shadow: 0 0 10px var(--cyan-dim);
    transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .bar-fill.warn { background: linear-gradient(90deg, var(--warn), #ffde7a); }
  .bar-fill.bad  { background: linear-gradient(90deg, var(--danger), #ff8a9a); }

  /* Teletype readout at panel bottom */
  .tech-ticker {
    margin-top: auto; font-size: 9px; color: var(--text-dim);
    letter-spacing: 1px; line-height: 1.8; flex-shrink: 0;
    border-top: 1px solid rgba(0,229,255,0.15); padding-top: 10px;
    white-space: pre-line;
  }
  .tech-ticker .cursor { animation: blink 1s steps(1) infinite; color: var(--cyan); }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- Hint ---------- */
  #hint {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    z-index: 8; font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text-dim); pointer-events: none;
    animation: hintFade 3s ease-in-out infinite;
  }
  @keyframes hintFade { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* Target reticle tracking the selected part (projected to 2D) */
  #reticle {
    position: fixed; width: 56px; height: 56px; z-index: 7;
    border: 1px solid var(--cyan); border-radius: 50%;
    pointer-events: none; opacity: 0;
    transition: opacity 0.3s;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 20px var(--cyan-dim), inset 0 0 14px var(--cyan-glow);
  }
  #reticle::after {
    content: ''; position: absolute; inset: 12px;
    border: 1px dashed var(--cyan-dim); border-radius: 50%;
    animation: reticleSpin 6s linear infinite;
  }
  @keyframes reticleSpin { to { transform: rotate(360deg); } }
  #reticle.locked { opacity: 1; }

  @media (max-width: 640px) {
    #spec-panel { width: calc(100vw - 48px); }
  }
</style>
</head>
<body>

<canvas id="scene-canvas"></canvas>
<div id="fx-overlay"></div>

<!-- Top HUD -->
<div id="top-bar">
  <div class="brand">JARVIS // Automotive Diagnostic Interface</div>
  <div class="clock">SYS.TIME <b id="clock">--:--:--</b></div>
</div>

<!-- Frame corners -->
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<!-- Controls -->
<div id="controls">
  <button class="hud-btn" id="btn-explode">Explode View</button>
  <button class="hud-btn" id="btn-auto-rotate">Auto Rotate</button>
  <button class="hud-btn" id="btn-reset">Reset Camera</button>
</div>

<div id="hint">Click a component to analyze</div>
<div id="reticle"></div>

<!-- Spec panel -->
<aside id="spec-panel">
  <button id="spec-close" title="Close">✕</button>
  <div class="panel-tag">Component Analysis</div>
  <h2 id="spec-name">—</h2>
  <div id="spec-id">ID: —</div>
  <div class="status-pill" id="spec-status">—</div>
  <div class="spec-divider"></div>
  <div id="spec-rows"></div>
  <div class="spec-divider"></div>
  <div class="bar-wrap">
    <div class="spec-row"><span class="k">Wear Level</span><span class="v" id="wear-val">0%</span></div>
    <div class="bar-track"><div class="bar-fill" id="wear-bar"></div></div>
  </div>
  <div class="bar-wrap">
    <div class="spec-row"><span class="k">Temperature</span><span class="v" id="temp-val">0°C</span></div>
    <div class="bar-track"><div class="bar-fill" id="temp-bar"></div></div>
  </div>
  <div class="tech-ticker" id="tech-ticker"></div>
</aside>

<!-- Import map: resolves bare "three" specifiers used inside three/addons -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
/* ================================================================
   JARVIS 3D Car Part Inspector
   Three.js ES modules via CDN + import map — no build step needed.
   ================================================================ */
import * as THREE from 'three';
import { OrbitControls }  from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { OutlinePass }    from 'three/addons/postprocessing/OutlinePass.js';

/* ---------------------------------------------------------------
   1. RENDERER / SCENE / CAMERA
   --------------------------------------------------------------- */
const canvas   = document.getElementById('scene-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04070d);
scene.fog = new THREE.FogExp2(0x04070d, 0.028);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
const HOME_POS = new THREE.Vector3(5.2, 3.4, 6.0);
const HOME_TARGET = new THREE.Vector3(0, 0.6, 0);
camera.position.copy(HOME_POS);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.copy(HOME_TARGET);
controls.minDistance = 2.5;
controls.maxDistance = 18;

/* ---------------------------------------------------------------
   2. LIGHTING — subtle sci-fi studio
   --------------------------------------------------------------- */
scene.add(new THREE.AmbientLight(0x334455, 1.2));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
keyLight.position.set(6, 10, 6);
scene.add(keyLight);

const rimCyan = new THREE.DirectionalLight(0x00e5ff, 0.9);
rimCyan.position.set(-8, 3, -6);
scene.add(rimCyan);

const fillMagenta = new THREE.PointLight(0xff2d78, 0.5, 30);
fillMagenta.position.set(5, -3, -5);
scene.add(fillMagenta);

/* ---------------------------------------------------------------
   3. GRID FLOOR
   --------------------------------------------------------------- */
const grid = new THREE.GridHelper(40, 40, 0x00e5ff, 0x0a2030);
grid.material.transparent = true;
grid.material.opacity = 0.25;
scene.add(grid);

/* ---------------------------------------------------------------
   4. PROCEDURAL CAR PARTS
   Each part is a THREE.Group. userData holds name/id/specs/status
   which drive the HUD panel. Each child mesh has an `explodeDir`
   vector used by the exploded-view animation.
   --------------------------------------------------------------- */
const carModel = new THREE.Group();
scene.add(carModel);

const MATERIALS = {
  steel:     new THREE.MeshStandardMaterial({ color: 0x9aa7b0, metalness: 0.95, roughness: 0.35 }),
  darkSteel: new THREE.MeshStandardMaterial({ color: 0x3a4248, metalness: 0.9,  roughness: 0.45 }),
  disc:      new THREE.MeshStandardMaterial({ color: 0x7d8a93, metalness: 1.0,  roughness: 0.25 }),
  rubber:    new THREE.MeshStandardMaterial({ color: 0x14181c, metalness: 0.0,  roughness: 0.95 }),
  carbon:    new THREE.MeshStandardMaterial({ color: 0x1c2228, metalness: 0.6,  roughness: 0.5 }),
  caliper:   new THREE.MeshStandardMaterial({ color: 0xc41e3a, metalness: 0.4,  roughness: 0.5 }),
};

/** Create a selectable sub-part group carrying HUD metadata */
function makePart(name, id, specs, status) {
  const g = new THREE.Group();
  g.userData = { isPart: true, name, id, specs, status };
  return g;
}

/* ---- PART: Brake Disc ---- */
const discPart = makePart('Brake Disc', 'BRK-DSC-042', {
  'Material': 'Carbon-Ceramic Composite',
  'Diameter': '380 mm',
  'Thickness': '34 mm',
  'Slots': '48 / Curved J-hook',
  'Torque Rating': '1,850 N·m',
}, { label: 'Nominal', color: 'var(--ok)' });
{
  const rotor = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 0.14, 48), MATERIALS.disc);
  rotor.rotation.x = Math.PI / 2;
  // Drilled-hole ring
  const holeGeo = new THREE.CylinderGeometry(0.045, 0.045, 0.16, 8);
  const holeMat = new THREE.MeshStandardMaterial({ color: 0x04070d });
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const h = new THREE.Mesh(holeGeo, holeMat);
    h.position.set(Math.cos(a) * 0.88, 0, Math.sin(a) * 0.88);
    h.rotation.x = Math.PI / 2;
    rotor.add(h);
  }
  discPart.add(rotor);

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.3, 24), MATERIALS.darkSteel);
  hub.rotation.x = Math.PI / 2;
  discPart.add(hub);

  // Lug nuts
  const lugGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.12, 6);
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const lug = new THREE.Mesh(lugGeo, MATERIALS.steel);
    lug.position.set(Math.cos(a) * 0.24, 0.18, Math.sin(a) * 0.24);
    discPart.add(lug);
  }
  discPart.position.set(-1.9, 0.9, 0.6);
  discPart.rotation.y = 0.5;
}

/* ---- PART: Brake Caliper ---- */
const caliperPart = makePart('Brake Caliper', 'CAL-6P-118', {
  'Material': 'Forged Aluminium Alloy',
  'Pistons': '6 / Monoblock',
  'Pad Compound': 'Semi-Metallic S3',
  'Clamp Force': '48 kN',
  'Brake Line': 'Stainless Braided',
}, { label: 'Monitor', color: 'var(--warn)' });
{
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.62, 0.95), MATERIALS.caliper);
  caliperPart.add(body);
  const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.14, 0.9), MATERIALS.darkSteel);
  bridge.position.y = 0.38;
  caliperPart.add(bridge);
  caliperPart.position.set(-1.55, 0.9, 1.55);
  caliperPart.rotation.y = 0.35;
}

/* ---- PART: V6 Engine Block (stylized) ---- */
const enginePart = makePart('V6 Engine Block', 'ENG-V6-330', {
  'Material': 'Cast Aluminium LSA',
  'Displacement': '3.0 L / V6 60°',
  'Redline': '7,200 RPM',
  'Compression': '11.3 : 1',
  'Output': '355 HP / 380 N·m',
}, { label: 'Nominal', color: 'var(--ok)' });
{
  const block = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.85, 1.1), MATERIALS.darkSteel);
  enginePart.add(block);

  // Two valve covers in a V configuration
  const coverGeo = new THREE.BoxGeometry(1.5, 0.28, 0.62);
  const coverL = new THREE.Mesh(coverGeo, MATERIALS.carbon);
  coverL.position.set(-0.35, 0.62, -0.35);
  coverL.rotation.x = -Math.PI / 6;
  enginePart.add(coverL);
  const coverR = new THREE.Mesh(coverGeo, MATERIALS.carbon);
  coverR.position.set(-0.35, 0.62, 0.35);
  coverR.rotation.x = Math.PI / 6;
  enginePart.add(coverR);

  // Intake plenum
  const plenum = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 1.2, 16), MATERIALS.steel);
  plenum.rotation.z = Math.PI / 2;
  plenum.position.set(0.45, 0.95, 0);
  enginePart.add(plenum);

  // Crank pulley
  const pulley = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.14, 24), MATERIALS.steel);
  pulley.rotation.z = Math.PI / 2;
  pulley.position.set(0.98, 0, 0);
  enginePart.add(pulley);

  enginePart.position.set(0.9, 0.55, -0.9);
  enginePart.rotation.y = -0.4;
}

/* ---- PART: Performance Wheel ---- */
const wheelPart = makePart('Performance Wheel', 'WHL-19X-9.5', {
  'Material': 'Flow-Formed Alloy',
  'Size': '19" × 9.5J',
  'Offset': 'ET35',
  'Tire': '275/35 R19 (Soft Compound)',
  'Weight': '10.8 kg',
}, { label: 'Critical', color: 'var(--danger)' });
{
  const tire = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.34, 20, 48), MATERIALS.rubber);
  wheelPart.add(tire);

  const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.88, 0.88, 0.34, 32), MATERIALS.steel);
  rim.rotation.x = Math.PI / 2;
  wheelPart.add(rim);

  // Spokes
  const spokeGeo = new THREE.BoxGeometry(0.14, 0.06, 0.72);
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2;
    const s = new THREE.Mesh(spokeGeo, MATERIALS.darkSteel);
    s.position.set(Math.cos(a) * 0.5, Math.sin(a) * 0.5, 0);
    s.rotation.z = a + Math.PI / 2;
    wheelPart.add(s);
  }
  wheelPart.position.set(1.9, 1.0, 1.3);
  wheelPart.rotation.y = -0.6;
}

const allParts = [discPart, caliperPart, enginePart, wheelPart];
allParts.forEach(p => carModel.add(p));

/* Assign explode directions + capture base positions per child.
   Explode vectors radiate outward from each part's local origin. */
function assignExplodeDirs(part) {
  part.children.forEach(child => {
    const dir = child.position.clone();
    if (dir.lengthSq() < 1e-6) dir.set(0, 1, 0); // center pieces pop upward
    child.userData.explodeDir = dir.normalize();
    child.userData.basePos = child.position.clone();
  });
}
allParts.forEach(assignExplodeDirs);

/* ---------------------------------------------------------------
   5. POST-PROCESSING — neon cyan outline for selection
   --------------------------------------------------------------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const outlinePass = new OutlinePass(
  new THREE.Vector2(innerWidth, innerHeight), scene, camera);
outlinePass.edgeStrength = 4;
outlinePass.edgeGlow = 1.2;
outlinePass.edgeThickness = 2;
outlinePass.visibleEdgeColor.set('#00e5ff');
outlinePass.hiddenEdgeColor.set('#003c46');
composer.addPass(outlinePass);

/* ---------------------------------------------------------------
   6. INTERACTION — raycast selection + smooth camera focus
   --------------------------------------------------------------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let selectedPart = null;
let camTween = null;

/** Walk up the scene tree to find the registered part group */
function partFromObject(obj) {
  let o = obj;
  while (o) {
    if (o.userData?.isPart) return o;
    o = o.parent;
  }
  return null;
}

/** Tween camera position + orbit target (ease-out cubic) */
function focusCamera(targetPoint, distance = 3.2) {
  const dir = camera.position.clone().sub(controls.target).normalize();
  const destPos = targetPoint.clone().add(dir.multiplyScalar(distance));
  camTween = {
    t: 0, dur: 0.9,
    fromPos: camera.position.clone(), toPos: destPos,
    fromTgt: controls.target.clone(), toTgt: targetPoint.clone(),
  };
}

function selectPart(part) {
  selectedPart = part;
  const meshes = [];
  part.traverse(o => { if (o.isMesh) meshes.push(o); });
  outlinePass.selectedObjects = meshes;

  const center = new THREE.Vector3();
  new THREE.Box3().setFromObject(part).getCenter(center);
  focusCamera(center);
  showSpecPanel(part);
}

function deselect() {
  selectedPart = null;
  outlinePass.selectedObjects = [];
  document.getElementById('spec-panel').classList.remove('open');
  document.getElementById('reticle').classList.remove('locked');
}

// Distinguish a click from an orbit-drag: track pointer travel
let downX = 0, downY = 0;
canvas.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
canvas.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return; // was a drag
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(carModel.children, true);
  if (hits.length) {
    const part = partFromObject(hits[0].object);
    if (part) { selectPart(part); return; }
  }
  deselect();
});

/* ---------------------------------------------------------------
   7. SPEC PANEL UI
   --------------------------------------------------------------- */
const panel    = document.getElementById('spec-panel');
const statusEl = document.getElementById('spec-status');
const wearBar  = document.getElementById('wear-bar');
const wearVal  = document.getElementById('wear-val');
const tempBar  = document.getElementById('temp-bar');
const tempVal  = document.getElementById('temp-val');
const reticle  = document.getElementById('reticle');
const tickerEl = document.getElementById('tech-ticker');

function showSpecPanel(part) {
  const { name, id, specs, status } = part.userData;
  document.getElementById('spec-name').textContent = name;
  document.getElementById('spec-id').textContent = 'ID: ' + id;

  statusEl.textContent = '◉ ' + status.label;
  statusEl.style.color = status.color;
  statusEl.style.borderColor = status.color;

  const rows = document.getElementById('spec-rows');
  rows.innerHTML = '';
  for (const [k, v] of Object.entries(specs)) {
    const row = document.createElement('div');
    row.className = 'spec-row';
    row.innerHTML = `<span class="k">${k}</span><span class="v hl">${v}</span>`;
    rows.appendChild(row);
  }

  // Deterministic pseudo-random telemetry per part id
  const seed = [...id].reduce((a, c) => a + c.charCodeAt(0), 0);
  const wear = seed % 60 + 8;
  const temp = (seed % 180) + 35;
  wearVal.textContent = wear + '%';
  tempVal.textContent = temp + '°C';
  wearBar.style.width = tempBar.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    wearBar.className = 'bar-fill' + (wear > 65 ? ' bad' : wear > 40 ? ' warn' : '');
    wearBar.style.width = wear + '%';
    tempBar.className = 'bar-fill' + (temp > 160 ? ' bad' : temp > 110 ? ' warn' : '');
    tempBar.style.width = Math.min(100, temp / 2) + '%';
  }));

  startTicker(id);
  panel.classList.add('open');
  reticle.classList.add('locked');
}

/* Teletype-style diagnostic readout */
let tickerTimer = null;
function startTicker(id) {
  clearInterval(tickerTimer);
  const lines = [
    `> SCANNING ${id}...`,
    `> ULTRASONIC PROBE ......... OK`,
    `> THERMAL MAP ACQUIRED ..... OK`,
    `> MICRO-FRACTURE DETECTION . ${Math.random() > 0.5 ? 'CLEAN' : '1 ANOMALY'}`,
    `> DIAGNOSTIC COMPLETE.`,
  ];
  const text = lines.join('\n');
  let i = 0;
  tickerEl.innerHTML = '';
  const span = document.createElement('span');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  cursor.textContent = '█';
  tickerEl.append(span, cursor);
  tickerTimer = setInterval(() => {
    span.textContent = text.slice(0, ++i);
    if (i >= text.length) clearInterval(tickerTimer);
  }, 14);
}

document.getElementById('spec-close').addEventListener('click', deselect);

/* ---------------------------------------------------------------
   8. EXPLODED VIEW — smooth eased animation of child offsets
   --------------------------------------------------------------- */
let exploded = false;
let explodeT = 0;
const btnExplode = document.getElementById('btn-explode');

btnExplode.addEventListener('click', () => {
  exploded = !exploded;
  btnExplode.classList.toggle('active', exploded);
  btnExplode.textContent = exploded ? 'Assemble View' : 'Explode View';
});

function applyExplode(dt) {
  const target = exploded ? 1 : 0;
  explodeT += (target - explodeT) * Math.min(1, dt * 4);
  if (Math.abs(target - explodeT) < 0.001) explodeT = target;

  if (explodeT === 0 && !exploded) {
    // Snap exactly home when fully retracted (cheap early-out)
    for (const part of allParts)
      for (const c of part.children) c.position.copy(c.userData.basePos);
    return;
  }
  for (const part of allParts)
    for (const c of part.children)
      c.position.copy(c.userData.basePos).addScaledVector(c.userData.explodeDir, explodeT * 1.1);
}

/* ---------------------------------------------------------------
   9. OTHER CONTROLS
   --------------------------------------------------------------- */
let autoRotate = false;
const btnRotate = document.getElementById('btn-auto-rotate');
btnRotate.addEventListener('click', () => {
  autoRotate = !autoRotate;
  controls.autoRotate = autoRotate;
  controls.autoRotateSpeed = 1.5;
  btnRotate.classList.toggle('active', autoRotate);
});

document.getElementById('btn-reset').addEventListener('click', () => {
  deselect();
  camTween = {
    t: 0, dur: 0.9,
    fromPos: camera.position.clone(), toPos: HOME_POS.clone(),
    fromTgt: controls.target.clone(), toTgt: HOME_TARGET.clone(),
  };
});

/* ---------------------------------------------------------------
   10. HUD CLOCK + RETICLE PROJECTION
   --------------------------------------------------------------- */
setInterval(() => {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-GB');
}, 1000);

const reticleCenter = new THREE.Vector3();
function updateReticle() {
  if (!selectedPart) return;
  new THREE.Box3().setFromObject(selectedPart).getCenter(reticleCenter);
  reticleCenter.project(camera);
  reticle.style.left = ((reticleCenter.x + 1) / 2 * innerWidth) + 'px';
  reticle.style.top  = ((-reticleCenter.y + 1) / 2 * innerHeight) + 'px';
}

/* ---------------------------------------------------------------
   11. MAIN LOOP
   --------------------------------------------------------------- */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (camTween) {
    camTween.t += dt / camTween.dur;
    const k = Math.min(camTween.t, 1);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(camTween.fromPos, camTween.toPos, e);
    controls.target.lerpVectors(camTween.fromTgt, camTween.toTgt, e);
    if (k >= 1) camTween = null;
  }

  // Idle showcase spin (pauses while a part is focused or exploded)
  if (!selectedPart && !exploded) carModel.rotation.y += dt * 0.12;

  applyExplode(dt);
  controls.update();
  updateReticle();
  composer.render();
}
animate();

/* ---------------------------------------------------------------
   12. RESIZE
   --------------------------------------------------------------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
